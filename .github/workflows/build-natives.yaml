name: Build Natives (Artifacts Only)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-26, name: macos-arm64 }
          - { os: macos-26-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v3

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Natives
        run: ./gradlew clean :native:assemble -PcmakeBuildType=Release -PbuildType=Release

      - name: Show produced jars
        if: always()
        shell: bash
        run: find . -name "*.jar" -not -path "*/.gradle/*"
      - name: Find native outputs
        if: always()
        shell: bash
        run: |
          echo "--- generator"
          grep -h "CMAKE_GENERATOR:" $(find . -name CMakeCache.txt -not -path "*/.gradle/*") || true
          echo "--- dll / lib files"
          find . \( -name "*.dll" -o -name "*.lib" \) -not -path "*/.gradle/*" | head -50
      - name: Verify jar contains a native library
        shell: bash
        run: |
          jar_file=$(ls native/build/libs/*.jar | grep -v -e sources -e javadoc | head -1)
          echo "Checking $jar_file"
          jar tf "$jar_file"
          jar tf "$jar_file" | grep -Ei '\.(dll|so|dylib)$' || { echo "No native library in jar"; exit 1; }

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luau-natives-${{ matrix.name }}
          path: |
            native/build/libs/luau-natives-*.jar
            !native/build/libs/*-sources.jar
            !native/build/libs/*-javadoc.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: luau-natives-*
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar