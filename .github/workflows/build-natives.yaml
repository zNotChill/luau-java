name: Build Natives (Artifacts Only)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-26, name: macos-arm64 }
          - { os: macos-26-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v3

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Natives
        run: ./gradlew clean :native:assemble -PcmakeBuildType=Release -PbuildType=Release

      - name: Show produced jars
        if: always()
        shell: bash
        run: find . -name "*.jar" -not -path "*/.gradle/*"

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luau-natives-${{ matrix.name }}
          path: "**/build/libs/*.jar"
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: luau-natives-*
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar